name: CD

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag to publish
        required: true
        type: string
      release_name:
        description: Release title (defaults to the tag when empty)
        required: false
        type: string
      checkout_ref:
        description: Branch, tag, or commit to build from
        required: false
        default: main
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.checkout_ref || github.ref }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        if: env.RELEASE_TAG != ''
        run: ./build-axion.sh all

      - name: Build project
        if: env.RELEASE_TAG == ''
        run: ./build-axion.sh all

      - name: Collect release jars
        if: env.RELEASE_TAG != ''
        run: |
          mkdir -p release-artifacts
          find build/libs -mindepth 2 -maxdepth 2 -type f -name 'Axion-v*.jar' -exec cp {} release-artifacts/ \;
          find paper-plugin/build/libs -mindepth 2 -maxdepth 2 -type f -name 'AxionPaper-v*.jar' -exec cp {} release-artifacts/ \;

      - name: Upload release jars
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: release-artifacts/*
          if-no-files-found: error

  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.release_tag, 'v'))
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.checkout_ref || github.ref }}

      - name: Resolve release notes
        id: notes
        run: |
          NOTES_PATH=".release/latest/${RELEASE_TAG}.md"
          if [ ! -f "${NOTES_PATH}" ]; then
            echo "Missing release notes: ${NOTES_PATH}" >&2
            exit 1
          fi
          echo "path=${NOTES_PATH}" >> "$GITHUB_OUTPUT"

      - name: Download release jars
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_name || env.RELEASE_TAG }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.checkout_ref || '' }}
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-artifacts/*
