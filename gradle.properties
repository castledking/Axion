# Version-specific properties (build-axion.sh overrides these per range)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.4
fabric_version=0.141.3+1.21.11
fabric_kotlin_version=1.13.9+kotlin.2.3.10
modmenu_version=17.0.0-beta.2
paper_version=1.21.11-R0.1-SNAPSHOT
paperweight_version=2.0.0-SNAPSHOT
org.gradle.parallel=true
# build-axion.sh moves staged jars out of build/libs and wipes Kotlin caches
# between range builds. Those edits happen outside Gradle, so a watching daemon
# keeps a stale VFS snapshot and skips tasks whose outputs were already removed
# (`:paper-plugin:jar` reports UP-TO-DATE and emits no jar).
org.gradle.vfs.watch=false
loom_version=1.15.4
kotlin_version=2.3.10
mod_version=0.2.15
maven_group=codes.castled.axion
archives_base_name=axion
mod_name=Axion
mod_author=castledking
mod_id=axion
license=GPL-3.0-only
description=Original in-world building workflows for Minecraft.
credits=
minecraft_version_range=[1.21.9,1.21.11]
fabric_loader_version=0.18.4
java_version=21
# NeoForge (for 1.21.11 target)
neoforge_version=21.11.45
neoforge_loader_version_range=[4,)
neo_form_version=1.21.11-20251209.172050
org.gradle.jvmargs=-Xmx3G
